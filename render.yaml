# Render Blueprint for Job Script Backend
# Deploy with: render blueprint apply

services:
  # FastAPI Backend
  - type: web
    name: skill-hunt-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    # The API also reads the shared skill matcher and taxonomy from etl/
    # (see backend/README.md), so changes there must redeploy it too.
    buildFilter:
      paths:
        - backend/**
        - etl/skill_patterns.py
        - etl/config/skills_taxonomy.json
    envVars:
      - key: SUPABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: CORS_ORIGINS
        value: https://jobscript.vercel.app,http://localhost:5173,http://localhost:5174
      - key: DEBUG
        value: false
      - key: CACHE_TTL_SECONDS
        value: 3600
    healthCheckPath: /health
    autoDeploy: true
