name: l ETL Pipeline

on:
  # Run every 2 weeks (1st and 15th of each month at 3 AM UTC)
  schedule:
    - cron: '0 3 1,15 * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      run_extraction:
        description: 'Run data extraction'
        type: boolean
        default: true
      run_transformation:
        description: 'Run data transformation'
        type: boolean
        default: true
      run_dbt:
        description: 'Run dbt models'
        type: boolean
        default: true
      test_mode:
        description: 'Test mode (limited data)'
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'
  ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
  ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
  SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
  SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
  SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
  # Multi-source ingestion keys (optional — each source auto-skips if blank)
  JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
  THEMUSE_API_KEY: ${{ secrets.THEMUSE_API_KEY }}
  USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
  USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}

jobs:
  extract:
    name: Extract Job Data
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run_extraction == 'true' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt
      
      - name: Run extraction (Adzuna)
        run: |
          cd etl
          if [ "${{ github.event.inputs.test_mode }}" == "true" ]; then
            python extractor.py --test
          else
            # Extract jobs from last 60 days only
            python extractor.py --days 60 --pages 3 --delay 1.5
          fi

      - name: Run multi-source ingestion (RemoteOK, WWR, Jooble, ...)
        run: |
          cd etl
          if [ "${{ github.event.inputs.test_mode }}" == "true" ]; then
            python ingest_sources.py --test
          else
            python ingest_sources.py
          fi

      - name: Upload extraction log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraction-log
          path: |
            etl/extraction.log
            etl/ingestion.log
          retention-days: 7

  transform:
    name: Transform & Extract Skills (Hybrid)
    runs-on: ubuntu-latest
    needs: extract
    if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.run_transformation == 'true') }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt
      
      - name: Run transformation (Taxonomy-based Skill Extraction)
        env:
          # SUPABASE_URL (transaction pooler, port 6543) drops long-lived
          # connections after ~20 min — this step can run that long once the
          # taxonomy or raw-job backlog grows. Force the session pooler
          # (same host, port 5432) so the connection survives the whole run.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          cd etl
          export SUPABASE_URL=$(python -c "import os,re; print(re.sub(r':6543/', ':5432/', os.environ['SUPABASE_URL']))")
          # Use fast-only mode: regex/taxonomy-based extraction only (no GLiNER/LLM)
          echo "Running in FAST MODE (Taxonomy-based extraction only)"
          python transformer.py --batch-size 500 --fast-only

      - name: Upload transformation log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transformation-log
          path: etl/transformation.log
          retention-days: 7

  fx_rates:
    name: Fetch Currency Rates
    runs-on: ubuntu-latest
    needs: transform
    if: ${{ always() && needs.transform.result == 'success' && (github.event_name == 'schedule' || github.event.inputs.run_dbt == 'true') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt

      - name: Fetch live currency exchange rates
        run: |
          cd etl
          # Live rates so salary comparisons across countries stay correct
          # (each mart row is one country/currency; the API blends rows for
          # the "All Countries" view using these USD-normalized figures).
          python fetch_currency_rates.py

      - name: Upload currency rates log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: currency-rates-log
          path: etl/currency_rates.log
          retention-days: 7

  dbt:
    name: Run dbt Models
    runs-on: ubuntu-latest
    needs: fx_rates
    if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.run_dbt == 'true') }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt
      
      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          # Profile name MUST match dbt_project.yml's `profile: job_script`.
          # schema MUST be `staging`: the mart models set config(schema='marts'),
          # and dbt's default schema-name macro prefixes it -> `staging_marts.*`,
          # which is exactly the schema the FastAPI backend reads. Using
          # schema `marts` here would build `marts_marts.*` and the API would
          # see stale/empty data.
          cat > ~/.dbt/profiles.yml << EOF
          job_script:
            outputs:
              prod:
                type: postgres
                host: ${{ secrets.SUPABASE_HOST }}
                port: 5432
                user: ${{ secrets.SUPABASE_USER }}
                password: ${{ secrets.SUPABASE_PASSWORD }}
                dbname: ${{ secrets.SUPABASE_DB }}
                schema: staging
                threads: 4
                connect_timeout: 30
                sslmode: require
            target: prod
          EOF
      
      - name: Test dbt connection
        working-directory: dbt_project
        run: dbt debug
      
      - name: Run dbt models
        working-directory: dbt_project
        run: |
          dbt deps
          dbt run --full-refresh
      
      - name: Run dbt tests
        working-directory: dbt_project
        run: dbt test
      
      - name: Generate dbt docs
        working-directory: dbt_project
        run: dbt docs generate
      
      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            dbt_project/target/manifest.json
            dbt_project/target/run_results.json
            dbt_project/target/catalog.json
          retention-days: 7

  archive:
    name: Archive Historical Data
    runs-on: ubuntu-latest
    needs: dbt
    if: ${{ always() && github.event_name == 'schedule' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt
      
      - name: Archive skill demand snapshot
        run: |
          python -c "
          import psycopg2
          import os
          
          conn = psycopg2.connect(os.getenv('SUPABASE_URL'))
          cursor = conn.cursor()
          cursor.execute('SELECT archive_skill_demand()')
          conn.commit()
          cursor.close()
          conn.close()
          print('Historical snapshot archived successfully')
          "

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [extract, transform, fx_rates, dbt, archive]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "Extract: ${{ needs.extract.result }}"
          echo "Transform: ${{ needs.transform.result }}"
          echo "FX Rates: ${{ needs.fx_rates.result }}"
          echo "dbt: ${{ needs.dbt.result }}"
          echo "Archive: ${{ needs.archive.result }}"

          if [ "${{ needs.extract.result }}" == "failure" ] || \
             [ "${{ needs.transform.result }}" == "failure" ] || \
             [ "${{ needs.dbt.result }}" == "failure" ]; then
            echo "::error::One or more jobs failed!"
            exit 1
          fi

          echo "All jobs completed successfully!"
