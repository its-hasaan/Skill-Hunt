name: ETL Pipeline

# One job, many steps: per-job setup counts against the 2,000 Actions
# minutes a private repo gets, and steps can gate each other on outcome.
on:
  schedule:
    - cron: '0 3 * * 1'        # Monday: everything incl. Adzuna (weekly, fits its quota)
    - cron: '0 3 * * 0,2-6'    # Other days: every non-Adzuna source
  workflow_dispatch:
    inputs:
      adzuna:
        description: 'Include Adzuna extraction'
        type: boolean
        default: false
      test_mode:
        description: 'Test mode (limited data)'
        type: boolean
        default: false
      vacuum_full:
        description: 'VACUUM FULL after retention'
        type: boolean
        default: false

concurrency:
  group: etl-pipeline
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
  ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
  JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
  THEMUSE_API_KEY: ${{ secrets.THEMUSE_API_KEY }}
  USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
  USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

jobs:
  pipeline:
    name: Daily pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: etl
    env:
      WEEKLY: ${{ github.event.schedule == '0 3 * * 1' || github.event.inputs.adzuna == 'true' }}
      TEST_FLAG: ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}
      FULL_VACUUM: ${{ (github.event.schedule == '0 3 * * 1' || github.event.inputs.vacuum_full == 'true') && '--vacuum-full' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preflight (credentials + connectivity)
        id: preflight
        run: python -m ops.run_step --step preflight -- python -m ops.preflight ${{ env.WEEKLY == 'true' && '--adzuna' || '' }}

      - name: Extract (Adzuna, weekly)
        id: adzuna
        if: steps.preflight.outcome == 'success' && env.WEEKLY == 'true'
        continue-on-error: true
        run: python -m ops.run_step --step adzuna --metric raw_inserted_adzuna -- python extractor.py --days 60 --pages 3 --delay 1.5 $TEST_FLAG

      - name: Discover company job boards (weekly)
        id: discover
        if: steps.preflight.outcome == 'success' && env.WEEKLY == 'true'
        continue-on-error: true
        run: python -m ops.run_step --step discover -- python -m ops.discover_companies --max-pages 2 --validate-limit 150

      - name: Ingest (remote boards, Jooble, company job boards, ...)
        id: ingest
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        run: python -m ops.run_step --step ingest --metric raw_inserted_other -- python ingest_sources.py $TEST_FLAG

      - name: Transform (taxonomy skill extraction)
        id: transform
        if: steps.adzuna.outcome == 'success' || steps.ingest.outcome == 'success'
        run: |
          SUPABASE_URL="$(python -c 'import os; from ops.dbconfig import session_pooler_url; print(session_pooler_url(os.environ["SUPABASE_URL"]))')"
          export SUPABASE_URL
          python -m ops.run_step --step transform --metric stg_processed -- python transformer.py --batch-size 500 --fast-only

      - name: Currency rates
        id: fx
        if: steps.transform.outcome == 'success'
        continue-on-error: true
        run: python -m ops.run_step --step fx -- python fetch_currency_rates.py

      - name: Dedup + eligibility labels (rules)
        id: enrich
        if: steps.preflight.outcome == 'success' && steps.transform.outcome != 'failure'
        run: python -m ops.run_step --step enrich -- python -m ops.enrich --dedup --rules

      - name: Eligibility labels (AI fallback, needs GEMINI_API_KEY)
        id: enrich_llm
        if: steps.enrich.outcome == 'success'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m ops.run_step --step enrich_llm -- python -m ops.enrich --llm --max-calls 150

      - name: Configure dbt connection
        if: steps.preflight.outcome == 'success'
        run: python -m ops.dbconfig --github-env

      - name: Build job feed (dbt, daily)
        id: feed
        if: steps.enrich.outcome == 'success'
        working-directory: dbt_project
        env:
          PYTHONPATH: ../etl
        run: |
          # profiles.yml is gitignored locally; the example is identical and
          # reads every connection value from the DB_* env set above.
          cp profiles.yml.example profiles.yml
          dbt deps --profiles-dir .
          python -m ops.run_step --step feed -- dbt run --profiles-dir . --target dev --select mart_job_feed
          python -m ops.run_step --step feed_test -- dbt test --profiles-dir . --target dev --select mart_job_feed

      - name: Enough fresh data to rebuild marts?
        id: guard
        if: steps.preflight.outcome == 'success' && steps.transform.outcome != 'failure'
        continue-on-error: true
        run: python -m ops.run_step --step marts_guard -- python -m ops.marts_guard

      - name: Build marts (dbt)
        id: dbt
        if: steps.guard.outcome == 'success'
        working-directory: dbt_project
        env:
          PYTHONPATH: ../etl
        run: |
          cp profiles.yml.example profiles.yml
          dbt deps --profiles-dir .
          python -m ops.run_step --step dbt -- dbt run --profiles-dir . --target dev --full-refresh --exclude mart_job_feed
          python -m ops.run_step --step dbt_test -- dbt test --profiles-dir . --target dev --exclude mart_job_feed

      - name: Archive skill-demand snapshot
        id: archive
        if: steps.dbt.outcome == 'success' && github.event_name == 'schedule'
        run: python -m ops.run_step --step archive -- python -m ops.archive

      - name: Retention (storage budget)
        id: retention
        if: steps.preflight.outcome == 'success' && steps.transform.outcome != 'failure'
        continue-on-error: true
        run: python -m ops.run_step --step retention --metric db_size_bytes -- python -m ops.retention $FULL_VACUUM

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: etl/*.log
          retention-days: 7

      - name: Summary and failure alert
        if: always()
        run: >-
          python -m ops.notify --results
          "preflight=${{ steps.preflight.outcome }},adzuna=${{ steps.adzuna.outcome }},discover=${{ steps.discover.outcome }},ingest=${{ steps.ingest.outcome }},transform=${{ steps.transform.outcome }},fx=${{ steps.fx.outcome }},enrich=${{ steps.enrich.outcome }},enrich_llm=${{ steps.enrich_llm.outcome }},feed=${{ steps.feed.outcome }},marts_guard=${{ steps.guard.outcome }},dbt=${{ steps.dbt.outcome }},archive=${{ steps.archive.outcome }},retention=${{ steps.retention.outcome }}"
